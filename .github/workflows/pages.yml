name: Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Deploy the wasm front end in web/ to GitHub Pages.  Least-privilege token
# plus the id-token needed by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; let a running one finish rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/configure-pages@v6
      with: { enablement: true }
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Build wasm
      run: wasm-pack build --release --target web
      working-directory: web
    - name: Stage static site
      run: |
        cd web
        mkdir _site
        cp -r index.html app.js style.css pkg _site/
    - uses: actions/upload-pages-artifact@v5
      with:
        path: web/_site
    # Since 2026-11-22 the Pages backend has refused about half the deploys
    # ("Deployment failed, try again later") with nothing wrong on our side,
    # and a later try lands.  Retry once after a pause.
    - id: deployment
      uses: actions/deploy-pages@v5
      continue-on-error: true
    - if: steps.deployment.outcome == 'failure'
      run: sleep 60
    - id: retry
      if: steps.deployment.outcome == 'failure'
      uses: actions/deploy-pages@v5
