name: Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Deploy the wasm front end in web/ to GitHub Pages.  Least-privilege token
# plus the id-token needed by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; let a running one finish rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    # susik is a path dependency (`../susik`) until it is on crates.io, so
    # both repositories are checked out side by side.
    - uses: actions/checkout@v7
      with: { path: tsap-oo }
    - uses: actions/checkout@v7
      with: { repository: jdh8/susik, path: susik }
    - uses: actions/configure-pages@v6
      with: { enablement: true }
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Build wasm
      run: wasm-pack build --release --target web
      working-directory: tsap-oo/web
    - name: Stage static site
      run: |
        cd tsap-oo/web
        mkdir _site
        cp -r index.html app.js style.css pkg _site/
    - uses: actions/upload-pages-artifact@v5
      with:
        path: tsap-oo/web/_site
    - id: deployment
      uses: actions/deploy-pages@v5
