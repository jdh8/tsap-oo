[package]
name = "tsap-oo"
version = "0.3.0-dev"
authors = ["Chen-Pang He (https://jdh8.org)"]
edition = "2024"
rust-version = "1.93"
description = "十胡 (Tsa̍p-ôo), the Taiwanese Four Color Cards game: rules, round state machine, scoreboard, and bots"
repository = "https://github.com/jdh8/tsap-oo"
homepage = "https://github.com/jdh8/tsap-oo"
documentation = "https://docs.rs/tsap-oo"
readme = "README.md"
license = "Apache-2.0"
categories = ["game-development", "games", "simulation"]
keywords = ["four-color-cards", "si-se-pai", "card-game", "taiwan", "bot"]
exclude = [".claude/", "CLAUDE.md", "ab/", "doc/", "research/", "tauri/", "web/"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["rand"]
# Shuffled dealing: `Round::deal` and `Game::deal`.
rand = ["dep:rand", "susik/rand"]
# A hidden window onto every hand, for the Peeker in `ab/` that measures what
# reading opponents could be worth at most.  No bot may use it.
peek = ["rand"]

[dependencies]
susik = "0.1.1"
rand = { version = "0.10", optional = true }
thiserror = "2"

# Auto-discovery would hide this example from `cargo run --example` listings
# when the feature is off; the explicit entry documents the requirement.
[[example]]
name = "arena"
required-features = ["rand"]

[[example]]
name = "census"
required-features = ["rand"]

[[example]]
name = "danger"
required-features = ["rand"]

[[example]]
name = "dealt"
required-features = ["rand"]

[[example]]
name = "fit"
required-features = ["rand"]

[[example]]
name = "gate"
required-features = ["rand"]

[[example]]
name = "nodes"
required-features = ["rand"]

[[example]]
name = "outlook"
required-features = ["rand"]

[[example]]
name = "safe"
required-features = ["rand"]

[profile.dev.package."*"]
opt-level = 2
